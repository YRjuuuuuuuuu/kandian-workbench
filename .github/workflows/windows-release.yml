name: Build Windows release

on:
  push:
    branches: ["release/windows/v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a draft release, for example v0.9.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      RELEASE_REF: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check version tag
        id: version
        run: |
          $tag = $env:RELEASE_REF -replace '^release/windows/', ''
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a release version tag' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build and verify the Windows distribution
        run: |
          $tag = "v$(python -c 'import content_engine; print(content_engine.__version__)')"
          if ($tag -ne $env:RELEASE_TAG) { throw 'Tag and package version differ' }
          python -X utf8 scripts/build_standalone.py
          New-Item -ItemType Directory -Force data | Out-Null
          $version = $env:RELEASE_TAG.Substring(1)
          python -X utf8 scripts/accept_standalone.py "dist/kandian-workbench-$version-windows-x64.zip" --port 8771
      - name: Attach files and publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft'
          if ($draft -ne 'true') { throw 'The target release must be a draft' }
          $version = $env:RELEASE_TAG.Substring(1)
          $asset = "dist/kandian-workbench-$version-windows-x64"
          gh release upload $env:RELEASE_TAG "$asset.zip" "$asset.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Upload reported an error; verifying the stored assets before proceeding.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft }
          if (-not $release) { throw 'Draft release disappeared' }
          foreach ($path in @("$asset.zip", "$asset.sha256")) {
            $name = Split-Path $path -Leaf
            $uploaded = $release.assets | Where-Object { $_.name -eq $name }
            $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($uploaded.state -ne 'uploaded' -or $uploaded.digest -ne "sha256:$digest") {
              throw "Uploaded asset verification failed: $name"
            }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest
